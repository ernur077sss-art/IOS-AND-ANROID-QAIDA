project_id = "qayda-qodex-mobile"
[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200
[db]
major_version = 17
[auth]
enabled = true
enable_anonymous_sign_ins = true
site_url = "https://qayda-qodex-mobile.vercel.app"
additional_redirect_urls = ["https://qayda-qodex-mobile.vercel.app/auth/callback", "qayda://login", "qayda:///login", "http://127.0.0.1:3002/auth/callback", "http://localhost:3002/auth/callback"]
[auth.email]
enable_signup = true
enable_confirmations = true
